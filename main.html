<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTP Verification</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1 id="verification_heading">Verify Your Account</h1>

    <p id="verification_subtext">
      We have sent a 6 digit OTP to your registered mobile number.
    </p>

    <div class="code-container">
      <input type="text" class="code" maxlength="1" id="code-1" inputmode="numeric">
      <input type="text" class="code" maxlength="1" id="code-2" inputmode="numeric">
      <input type="text" class="code" maxlength="1" id="code-3" inputmode="numeric">
      <input type="text" class="code" maxlength="1" id="code-4" inputmode="numeric">
      <input type="text" class="code" maxlength="1" id="code-5" inputmode="numeric">
      <input type="text" class="code" maxlength="1" id="code-6" inputmode="numeric">
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
